# Deploys the portfolio to GitHub Pages.
#
# Deploys to https://Ankita301.github.io/portfolio/ on every push to main.
#
# The page carries <meta name="robots" content="noindex, nofollow"> so the
# preview URL is reachable but not crawled. When moving to the custom domain:
# remove that meta tag, drop VITE_BASE so base returns to '/', and add a CNAME.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /portfolio/
      # SPA fallback: Pages serves 404.html for unknown paths, so /projects/x
      # resolves to the app instead of a GitHub 404.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
