# Deploys the portfolio to GitHub Pages.
#
# DRAFT MODE: this workflow runs ONLY when triggered by hand from the Actions
# tab. It deliberately has no `push` trigger, so nothing publishes by accident.
# To go live: enable Pages (Settings -> Pages -> Source: GitHub Actions), then
# run this workflow once. Add a `push` trigger only if you want every commit to
# deploy.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA fallback: Pages serves 404.html for unknown paths, so /projects/x
      # resolves to the app instead of a GitHub 404.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
